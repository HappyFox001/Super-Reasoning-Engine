<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64" role="img" aria-label="Super Reasoning Engine">
  <style>
    .ink { stroke: #0B0D10; }
    .dot { fill: #0086A8; }
    .base { stroke: #C9CED4; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #E8EAED; }
      .dot { fill: #4DE1FF; }
      .base { stroke: #2A313A; }
    }
  </style>
  <line class="base" x1="10" y1="52" x2="54" y2="52" stroke-width="2" stroke-linecap="square"/>
  <polyline class="ink" points="10,52 30,20 54,20" fill="none" stroke-width="5" stroke-linecap="square"/>
  <circle class="dot" cx="30" cy="20" r="5"/>
</svg>
