name: Skill checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check shell syntax
        run: |
          bash -n scripts/codex_task.sh
          bash -n scripts/codex_correct.sh
      - name: Run tests without a GPU or Codex login
        run: python3 -m unittest discover -s tests -v
